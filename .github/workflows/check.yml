name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-build
      - name: Run user-journey and source checks
        run: |
          nix build \
            .#checks.x86_64-linux.kiosk \
            .#checks.x86_64-linux.github-keys \
            .#checks.x86_64-linux.onboarding \
            .#checks.x86_64-linux.rotation-choice \
            .#checks.x86_64-linux.source
